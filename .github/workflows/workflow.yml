name: Generate README

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * *'

# The repository default token is read-write on every scope. The job only commits README.md.
permissions:
  contents: write

# One run at a time: a push and the cron must not both commit README.md. Queued, never cancelled mid-commit.
concurrency:
  group: generate-readme
  cancel-in-progress: false

jobs:
  generate-readme:
    name: Generate README
    runs-on: ubuntu-latest
    # Normal run is about 15 s. Without a timeout a hang bills up to 6 h.
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Generate README
        run: bun index.js > README.md

      - name: Commit changes
        uses: EndBug/add-and-commit@1bad3abcf0d6ec49a5857d124b0bfb52dc7bb081 # v9.1.3
        with:
          author_name: Popwers
          author_email: lionel.bataille@hotmail.com
          message: ':memo: README.md update'
